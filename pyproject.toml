[project]
name = "some-agent-like-you"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhengfeng", email = "zhengfeng.cai@thoughtworks.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mem0ai[extras,nlp]>=2.0.18",
    "ollama>=0.5.3",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
some-agent-like-you = "some_agent_like_you:main"
memory_daemon = "some_agent_like_you.memory_daemon:main"
recall-memory = "some_agent_like_you.recall_memory:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
